# Every hour: fetch the games from the Asana project "Live" into markets/live.enc.json (encrypted, for the hidden
# Markets pages) and the counts of the Asana projects "Alerts" and "Support" into alerts/ and support/, and publish when something changed.
# Needs the repository secrets ASANA_TOKEN (an Asana personal access token), MARKETS_PASSWORD (the shared password, Playlist) and PLAYLIST_DK … _IE (a password per
# country, Market Tools). It can also be run by hand from the Actions tab.
name: Asana live games, alerts and support

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: asana-live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch from Asana
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          MARKETS_PASSWORD: ${{ secrets.MARKETS_PASSWORD }}
          MARKETS_PASSWORD_DK: ${{ secrets.PLAYLIST_DK }}
          MARKETS_PASSWORD_SE: ${{ secrets.PLAYLIST_SE }}
          MARKETS_PASSWORD_FI: ${{ secrets.PLAYLIST_FI }}
          MARKETS_PASSWORD_DE: ${{ secrets.PLAYLIST_DE }}
          MARKETS_PASSWORD_PT: ${{ secrets.PLAYLIST_PT }}
          MARKETS_PASSWORD_IE: ${{ secrets.PLAYLIST_IE }}
        run: node tools/asana-live.mjs
      - name: Commit and publish when the games, alerts or support tickets changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- 'markets/*.enc.json' 'alerts/*.enc.json' 'support/*.enc.json')" ]; then
            echo "Nothing changed"
            exit 0
          fi
          git config user.name "asana-live"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add markets/*.enc.json alerts/*.enc.json support/*.enc.json
          git commit -m "Live games from Asana"
          git pull --rebase origin main
          git push origin HEAD:main
          # A push from this job does not start a GitHub Pages build by itself, so ask for one
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Could not request a Pages build"
