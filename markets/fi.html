<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finland — Cinemataztic Markets</title>
    <meta name="description" content="Internal: the games in Finland, from Asana.">
    <!-- Hidden page under Markets: not in the menu, the footer or sitemap.xml, and not to be shown in search engines.
         The country pages (dk, se, fi, de, pt, ie) are the same apart from the country code on <body> and these texts. -->
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://www.cinemataztic.com/markets/fi.html">
    <link rel="icon" href="../favicon.ico" sizes="32x32">
    <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://api.fontshare.com">
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@200,300,400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/site.css?v=5">
    <link rel="stylesheet" href="markets.css?v=3">
</head>
<body data-country="fi" class="bg-brand-dark text-white font-sans antialiased selection:bg-brand-cyan selection:text-black min-h-screen flex flex-col">
    <header class="fixed top-0 left-0 right-0 z-50 bg-brand-dark/80 backdrop-blur-md border-b border-brand-border">
        <div class="w-full px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="./" class="flex items-center space-x-2 group">
                <span class="text-2xl sm:text-3xl font-logo font-bold tracking-[0.05em] uppercase text-white group-hover:opacity-90 transition">CINEMATAZTIC / MARKETS</span>
            </a>
            <nav class="flex items-center space-x-6 text-xs font-bold tracking-widest uppercase">
                <a href="../index.html" class="mk-website hover:text-brand-cyan transition">Website</a>
                <button type="button" id="mkLogout" class="mk-logout">Log out</button>
            </nav>
        </div>
    </header>

    <main class="flex-grow pt-20">
        <div class="mk-wrap">
            <nav class="mk-nav" id="mkNav" aria-label="Markets"></nav>
            <span class="mk-label">Internal · from Asana</span>
            <h1 class="mk-title">Finland</h1>
            <p class="mk-updated mt-3" id="mkUpdated"></p>

            <div class="mk-panels">
                <section class="mk-panel"><h2>Live now <span id="mkLiveCount"></span></h2><div id="mkLive"></div></section>
                <section class="mk-panel"><h2>Starts in the next 30 days <span id="mkSoonCount"></span></h2><div id="mkSoon"></div></section>
            </div>

            <div class="mk-bar">
                <h2 class="mk-h2" style="margin-top:0">Timeline</h2>
                <div class="mk-year">
                    <button type="button" id="mkPrev" aria-label="Previous year"><i class="fa-solid fa-chevron-left"></i></button>
                    <span id="mkYear"></span>
                    <button type="button" id="mkNext" aria-label="Next year"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
            <div class="mk-legend" id="mkLegend"></div>
            <div class="mk-scroll"><div class="mk-tl" id="mkTimeline"></div></div>
        </div>
    </main>

    <footer class="border-t border-brand-border px-4 sm:px-6 lg:px-8 py-6 text-xs text-gray-500">© 2026 Cinemataztic ApS · Internal page</footer>

    <script src="markets.js?v=3"></script>
    <script>
        (async function renderCountry() {
            const M = Markets;
            const country = M.COUNTRIES.find(c => c.code === document.body.dataset.country);
            M.nav(document.getElementById('mkNav'), country.code);
            let data;
            try { data = await M.load(); } catch (e) {
                document.getElementById('mkTimeline').innerHTML = '<p class="mk-tl__none">The games could not be loaded. Try again in a moment.</p>';
                return;
            }
            document.getElementById('mkUpdated').textContent = M.updated(data);

            // Only this country's games
            const games = data.tasks.filter(t => t.market === country.name);
            const live = games.filter(M.isLive).sort((a, b) => a.due.localeCompare(b.due));
            const soon = games.filter(M.startsSoon).sort((a, b) => a.start.localeCompare(b.start));
            document.getElementById('mkLiveCount').textContent = live.length;
            document.getElementById('mkSoonCount').textContent = soon.length;
            document.getElementById('mkLive').innerHTML = live.length ? M.list(live, t => `until ${M.fmt(t.due)}`) : '<p class="mk-card__empty">Nothing live right now</p>';
            document.getElementById('mkSoon').innerHTML = soon.length ? M.list(soon, t => M.fmt(t.start)) : '<p class="mk-card__empty">Nothing starts in the next 30 days</p>';

            M.legend(document.getElementById('mkLegend'), games);
            M.timeline(document.getElementById('mkTimeline'), {
                year: document.getElementById('mkYear'), prev: document.getElementById('mkPrev'), next: document.getElementById('mkNext'),
            }, data, [country.name]);
        })();
    </script>
</body>
</html>
